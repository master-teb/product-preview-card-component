<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Frontend Mentor Challenge - Product preview card component">
  <title>Frontend Mentor | Product preview card component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="product-card">
    <section class="product-image">
      <img src="images\image-product-desktop.jpg" alt="Perfume bottle" class="desktop-image">
      <img src="images\image-product-mobile.jpg" alt="Perfume bottle" class="mobile-image">
    </section>

    <section class="product-details">
      <h1 class="hero-title">Perfume</h1>
      <h2 class="product-name">Gabrielle Essence Eau De Parfum</h2>
      <p class="product-description">
        A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.
      </p>
      <p class="price">
        <span class="current-price">$149.99</span>
        <span class="original-price">$169.99</span>
      </p>

      <button class="add-to-cart"><div class="cart-icon"><img src="images\icon-cart.svg" alt="Cart icon" class="cart-icon-img"></div>Add to Cart</button>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a> 
    Coded by <a href="#">Teboho Mosia (master-teb)</a>
  </footer>
</body>
</html>
